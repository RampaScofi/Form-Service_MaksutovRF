<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форма</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="form-container">
    <h1 id="form-title"></h1>
    <p id="form-description" class="form-description"></p>
    <form id="form" novalidate>
      <button type="submit" class="btn btn-primary" id="submit-btn" style="display:block; width:100%; padding:0.75rem 1.5rem; font-size:1rem; margin-top:0.5rem;">Отправить заявку</button>
    </form>
    <div id="success" class="success-message" style="display:none;"></div>
    <div id="generic-error" class="error-message" style="display:none;"></div>
  </div>

  <script id="form-schema" type="application/json">__FORM_SCHEMA_JSON__</script>

  <script>
    (function () {
      var raw = document.getElementById('form-schema').textContent;
      var schema = JSON.parse(raw);

      document.getElementById('form-title').textContent = schema.name;
      document.getElementById('form-description').textContent = schema.description || '';

      var form = document.getElementById('form');
      var successEl = document.getElementById('success');
      var genericErrorEl = document.getElementById('generic-error');
      var submitBtn = document.getElementById('submit-btn');

      var emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
      var numberRe = /^\d+([.,]\d+)?$/;
      var dateRe = /^\d{4}-\d{2}-\d{2}$/;
      var phoneAllowedRe = /^[+\d\s\-()]+$/;

      /** Read the current value of a field from the DOM. */
      function readValue(field) {
        if (field.type === 'radio') {
          var checked = form.querySelector('input[name="' + field.fieldId + '"]:checked');
          return checked ? checked.value : '';
        }
        if (field.type === 'checkbox_group') {
          var allChecked = form.querySelectorAll('input[name="' + field.fieldId + '"]:checked');
          var vals = [];
          allChecked.forEach(function (el) { vals.push(el.value); });
          var order = field.options || [];
          vals.sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); });
          return vals.join(', ');
        }
        var el = document.getElementById(field.fieldId);
        return el ? (el.value || '') : '';
      }

      schema.fields.forEach(function (field) {
        var wrapper = document.createElement('div');
        wrapper.className = 'form-field';
        wrapper.setAttribute('data-field-id', field.fieldId);

        var label = document.createElement('label');
        var isChoiceType = field.type === 'radio' || field.type === 'checkbox_group';
        if (!isChoiceType) label.htmlFor = field.fieldId;
        label.textContent = field.label;
        if (field.required) {
          var asterisk = document.createElement('span');
          asterisk.className = 'required-marker';
          asterisk.textContent = '*';
          label.appendChild(asterisk);
        }
        wrapper.appendChild(label);

        if (field.type === 'text_short') {
          var input = document.createElement('input');
          input.type = 'text';
          input.name = field.fieldId;
          input.id = field.fieldId;
          if (field.required) input.setAttribute('required', '');
          input.maxLength = 300;
          wrapper.appendChild(input);
        } else if (field.type === 'text_long') {
          var textarea = document.createElement('textarea');
          textarea.name = field.fieldId;
          textarea.id = field.fieldId;
          textarea.rows = 4;
          if (field.required) textarea.setAttribute('required', '');
          textarea.maxLength = 5000;
          wrapper.appendChild(textarea);
        } else if (field.type === 'email') {
          var emailInput = document.createElement('input');
          emailInput.type = 'email';
          emailInput.name = field.fieldId;
          emailInput.id = field.fieldId;
          if (field.required) emailInput.setAttribute('required', '');
          wrapper.appendChild(emailInput);
        } else if (field.type === 'select') {
          var select = document.createElement('select');
          select.name = field.fieldId;
          select.id = field.fieldId;
          if (field.required) select.setAttribute('required', '');
          var defaultOption = document.createElement('option');
          defaultOption.value = '';
          defaultOption.textContent = '-- выберите --';
          select.appendChild(defaultOption);
          (field.options || []).forEach(function (opt) {
            var o = document.createElement('option');
            o.value = opt;
            o.textContent = opt;
            select.appendChild(o);
          });
          wrapper.appendChild(select);
        } else if (field.type === 'number') {
          var numInput = document.createElement('input');
          numInput.type = 'number';
          numInput.inputMode = 'numeric';
          numInput.name = field.fieldId;
          numInput.id = field.fieldId;
          if (field.required) numInput.setAttribute('required', '');
          wrapper.appendChild(numInput);
        } else if (field.type === 'date') {
          var dateInput = document.createElement('input');
          dateInput.type = 'date';
          dateInput.name = field.fieldId;
          dateInput.id = field.fieldId;
          if (field.required) dateInput.setAttribute('required', '');
          wrapper.appendChild(dateInput);
        } else if (field.type === 'phone') {
          var phoneInput = document.createElement('input');
          phoneInput.type = 'tel';
          phoneInput.inputMode = 'tel';
          phoneInput.name = field.fieldId;
          phoneInput.id = field.fieldId;
          if (field.required) phoneInput.setAttribute('required', '');
          wrapper.appendChild(phoneInput);
        } else if (field.type === 'radio' || field.type === 'checkbox_group') {
          var choiceGroup = document.createElement('fieldset');
          choiceGroup.className = 'choice-group';
          choiceGroup.setAttribute('data-field-id', field.fieldId);
          (field.options || []).forEach(function (opt, idx) {
            var optDiv = document.createElement('div');
            optDiv.className = 'choice-option';
            var cb = document.createElement('input');
            cb.type = field.type === 'radio' ? 'radio' : 'checkbox';
            cb.name = field.fieldId;
            cb.id = field.fieldId + '__' + idx;
            cb.value = opt;
            if (field.required && field.type === 'radio') cb.setAttribute('required', '');
            var cbLabel = document.createElement('label');
            cbLabel.htmlFor = cb.id;
            var optSpan = document.createElement('span');
            optSpan.className = 'choice-text';
            optSpan.textContent = opt;
            cbLabel.appendChild(optSpan);
            optDiv.appendChild(cb);
            optDiv.appendChild(cbLabel);
            choiceGroup.appendChild(optDiv);
          });
          wrapper.appendChild(choiceGroup);
        }

        var errorEl = document.createElement('div');
        errorEl.className = 'field-error';
        errorEl.id = 'error-' + field.fieldId;
        wrapper.appendChild(errorEl);

        form.insertBefore(wrapper, submitBtn);
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        clearErrors();
        var answers = [];
        var clientErrors = [];

        schema.fields.forEach(function (field) {
          var value = readValue(field);
          var trimmed = value.trim();

          if (field.required && !trimmed) {
            clientErrors.push({ fieldId: field.fieldId, message: 'Поле обязательно для заполнения' });
            return;
          }
          if (trimmed === '') return;

          if (field.type === 'email' && !emailRe.test(trimmed)) {
            clientErrors.push({ fieldId: field.fieldId, message: 'Укажите корректный email' });
          }

          if (field.type === 'number' && !numberRe.test(trimmed)) {
            clientErrors.push({ fieldId: field.fieldId, message: 'Укажите число' });
          }

          if (field.type === 'date') {
            if (!dateRe.test(trimmed)) {
              clientErrors.push({ fieldId: field.fieldId, message: 'Укажите корректную дату' });
            } else {
              var parts = trimmed.split('-').map(Number);
              var dt = new Date(parts[0], parts[1] - 1, parts[2]);
              if (dt.getFullYear() !== parts[0] || dt.getMonth() !== parts[1] - 1 || dt.getDate() !== parts[2]) {
                clientErrors.push({ fieldId: field.fieldId, message: 'Укажите корректную дату' });
              }
            }
          }

          if (field.type === 'phone') {
            if (!phoneAllowedRe.test(trimmed)) {
              clientErrors.push({ fieldId: field.fieldId, message: 'Укажите корректный номер телефона' });
            } else {
              var digitCount = (trimmed.match(/\d/g) || []).length;
              if (digitCount < 7 || digitCount > 15) {
                clientErrors.push({ fieldId: field.fieldId, message: 'Укажите корректный номер телефона' });
              }
            }
          }

          if ((field.type === 'select' || field.type === 'radio') && field.options && !field.options.includes(trimmed)) {
            clientErrors.push({ fieldId: field.fieldId, message: 'Выберите значение из списка' });
          }

          if (field.type === 'checkbox_group' && field.options) {
            var cbParts = trimmed.split(', ');
            var cbSeen = {};
            var cbBad = false;
            for (var ci = 0; ci < cbParts.length; ci++) {
              if (field.options.indexOf(cbParts[ci]) === -1 || cbSeen[cbParts[ci]]) { cbBad = true; break; }
              cbSeen[cbParts[ci]] = true;
            }
            if (cbBad) clientErrors.push({ fieldId: field.fieldId, message: 'Выберите значения из списка' });
          }

          if (field.type === 'text_short' && trimmed.length > 300) {
            clientErrors.push({ fieldId: field.fieldId, message: 'Не более 300 символов' });
          }
          if (field.type === 'text_long' && trimmed.length > 5000) {
            clientErrors.push({ fieldId: field.fieldId, message: 'Не более 5000 символов' });
          }

          answers.push({ fieldId: field.fieldId, value: trimmed });
        });

        if (clientErrors.length) {
          showClientErrors(clientErrors);
          return;
        }

        submitBtn.disabled = true;

        fetch('/api/forms/' + schema.slug + '/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answers: answers })
        })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.errors && data.errors.length) {
            showClientErrors(data.errors);
            submitBtn.disabled = false;
            return;
          }
          form.style.display = 'none';
          successEl.style.display = 'block';
          successEl.textContent = '✅ Спасибо! Ваша заявка отправлена.';
        })
        .catch(function () {
          genericErrorEl.style.display = 'block';
          genericErrorEl.textContent = 'Ошибка отправки. Попробуйте позже.';
          submitBtn.disabled = false;
        });
      });

      function clearErrors() {
        var els = form.querySelectorAll('.field-error');
        for (var i = 0; i < els.length; i++) els[i].textContent = '';
        form.querySelectorAll('.form-field, .choice-group').forEach(function (f) { f.classList.remove('has-error'); });
        successEl.style.display = 'none';
        genericErrorEl.style.display = 'none';
      }

      function showClientErrors(errors) {
        errors.forEach(function (err) {
          var el = document.getElementById('error-' + err.fieldId);
          if (el) el.textContent = err.message;
          var fieldEl = document.getElementById(err.fieldId);
          if (fieldEl) {
            var fw = fieldEl.closest('.form-field');
            if (fw) fw.classList.add('has-error');
          } else {
            var fallback = form.querySelector('[data-field-id="' + err.fieldId + '"]');
            if (fallback) fallback.classList.add('has-error');
          }
        });
        form.querySelectorAll('.form-field').forEach(function (f) {
          var errDiv = f.querySelector('.field-error');
          if (errDiv && !errDiv.textContent) f.classList.remove('has-error');
        });
        form.querySelectorAll('.choice-group').forEach(function (f) {
          var errDiv = f.closest('.form-field') ? f.closest('.form-field').querySelector('.field-error') : null;
          if (errDiv && !errDiv.textContent) f.classList.remove('has-error');
        });
      }
    })();
  </script>
</body>
</html>
